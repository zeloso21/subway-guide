<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F6F3EE">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>서울 전시 지도</title>
  <meta name="description" content="서울시 문화행사 공공데이터로 지금 갈 수 있는 미술 전시를 찾아보세요.">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <style>
    :root {
      --bg: #F6F3EE;
      --surface: #FFFFFF;
      --ink: #1B1A17;
      --ink-2: #5E5A52;
      --ink-3: #8F897E;
      --line: #E4DED3;
      --accent: #C2410C;
      --accent-soft: #FBE9DF;
      --free: #166534;
      --free-soft: #E3F1E6;
      --chip: #EDE8DF;
      --shadow: 0 1px 2px rgba(27,26,23,.06), 0 4px 16px rgba(27,26,23,.06);
      --serif: 'Gowun Batang', 'AppleMyungjo', serif;
      --sans: 'Noto Sans KR', -apple-system, 'Malgun Gothic', sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #14130F; --surface: #1E1C18; --ink: #F2EEE6; --ink-2: #BDB6A8; --ink-3: #8A8476;
        --line: #2F2C26; --accent: #FB923C; --accent-soft: #3A2417; --free: #86EFAC; --free-soft: #17301F;
        --chip: #29261F; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
      }
    }
    :root[data-theme="dark"] {
      --bg: #14130F; --surface: #1E1C18; --ink: #F2EEE6; --ink-2: #BDB6A8; --ink-3: #8A8476;
      --line: #2F2C26; --accent: #FB923C; --accent-soft: #3A2417; --free: #86EFAC; --free-soft: #17301F;
      --chip: #29261F; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: var(--sans); background: var(--bg); color: var(--ink); display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
    button, input, select { font: inherit; color: inherit; }
    a { color: inherit; }

    /* 헤더 */
    header { padding: max(16px, env(safe-area-inset-top)) 16px 10px; }
    .brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    h1 { font-family: var(--serif); font-size: 26px; font-weight: 700; letter-spacing: -.5px; }
    h1 span { color: var(--accent); }
    .updated { font-size: 11px; color: var(--ink-3); white-space: nowrap; }
    .summary { margin-top: 4px; font-size: 13px; color: var(--ink-2); }
    .summary b { color: var(--ink); }

    /* 컨트롤 */
    .controls { padding: 0 16px 10px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line); }
    .search { position: relative; }
    .search input { width: 100%; height: 42px; padding: 0 14px 0 38px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font-size: 15px; outline: none; }
    .search input:focus { border-color: var(--ink-3); }
    .search svg { position: absolute; left: 12px; top: 12px; width: 18px; height: 18px; color: var(--ink-3); }
    .seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--chip); border-radius: 10px; padding: 3px; }
    .seg button { border: 0; background: none; height: 34px; border-radius: 8px; font-size: 14px; color: var(--ink-2); cursor: pointer; }
    .seg button.on { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: var(--shadow); }
    .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex-shrink: 0; height: 34px; padding: 0 14px; border: 1px solid var(--line); border-radius: 17px; background: var(--surface); font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
    .chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
    select.chip { appearance: none; padding-right: 28px; background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%); background-position: calc(100% - 15px) 15px, calc(100% - 10px) 15px; background-size: 5px 5px; background-repeat: no-repeat; }

    /* 본문 */
    main { flex: 1; min-height: 0; display: flex; position: relative; }
    #list { flex: 1; overflow-y: auto; padding: 12px 16px calc(84px + env(safe-area-inset-bottom)); }
    #mapWrap { flex: 1; display: none; position: relative; }
    #map { position: absolute; inset: 0; background: var(--chip); }
    /* OSM 기본 타일은 색이 강해서, 채도를 빼고 밝게 눌러 갤러리 톤에 맞춘다 */
    #map .leaflet-tile-pane { filter: grayscale(.85) sepia(.12) brightness(1.04) contrast(.9); }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) #map .leaflet-tile-pane { filter: grayscale(1) invert(1) brightness(.85) contrast(.85); }
    }
    :root[data-theme="dark"] #map .leaflet-tile-pane { filter: grayscale(1) invert(1) brightness(.85) contrast(.85); }
    body.view-map #list { display: none; }
    body.view-map #mapWrap { display: block; }

    .card { display: flex; gap: 14px; padding: 12px; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); margin-bottom: 10px; cursor: pointer; text-align: left; width: 100%; border: 0; }
    .card:active { transform: scale(.995); }
    .card.sel { outline: 2px solid var(--accent); }
    .poster { width: 76px; height: 104px; border-radius: 8px; flex-shrink: 0; object-fit: cover; background: var(--chip); }
    .poster.ph { display: grid; place-items: center; font-family: var(--serif); font-size: 28px; color: var(--ink-3); }
    .card-body { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .card h3 { font-family: var(--serif); font-size: 16px; font-weight: 700; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .meta { font-size: 12.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .badges { display: flex; flex-wrap: wrap; gap: 5px; margin-top: auto; }
    .badge { font-size: 11px; font-weight: 700; padding: 3px 7px; border-radius: 6px; background: var(--chip); color: var(--ink-2); }
    .badge.free { background: var(--free-soft); color: var(--free); }
    .badge.hot { background: var(--accent-soft); color: var(--accent); }

    .empty { text-align: center; padding: 56px 20px; color: var(--ink-2); font-size: 14px; line-height: 1.7; }
    .empty h2 { font-family: var(--serif); font-size: 20px; color: var(--ink); margin-bottom: 8px; }
    .empty code { background: var(--chip); padding: 1px 6px; border-radius: 4px; font-size: 13px; }
    .more { display: block; margin: 8px auto 0; height: 42px; padding: 0 24px; border-radius: 21px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 14px; }

    /* 목록/지도 토글 */
    .viewtoggle { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 500; display: flex; background: var(--ink); border-radius: 24px; padding: 4px; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
    .viewtoggle button { border: 0; background: none; color: var(--bg); opacity: .6; height: 38px; padding: 0 18px; border-radius: 20px; font-size: 14px; font-weight: 700; cursor: pointer; }
    .viewtoggle button.on { opacity: 1; background: rgba(255,255,255,.14); }

    /* 지도 마커 */
    .pin { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
    .pin.free { background: #16A34A; }
    .leaflet-popup-content { font-family: var(--sans); margin: 10px 12px; }
    .pop-title { font-family: var(--serif); font-weight: 700; font-size: 14px; margin-bottom: 2px; }
    .pop-meta { font-size: 12px; color: #5E5A52; }
    .pop-btn { margin-top: 6px; font-size: 12px; font-weight: 700; color: #C2410C; background: none; border: 0; padding: 0; cursor: pointer; }

    /* 상세 시트 */
    .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 1100; opacity: 0; pointer-events: none; transition: opacity .2s; }
    .sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 88dvh; overflow-y: auto; background: var(--surface); border-radius: 20px 20px 0 0; z-index: 1101; transform: translateY(100%); transition: transform .25s ease; padding: 0 0 calc(20px + env(safe-area-inset-bottom)); }
    body.sheet-open .sheet-bg { opacity: 1; pointer-events: auto; }
    body.sheet-open .sheet { transform: none; }
    .sheet-grip { position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; padding: 10px 12px 6px 20px; background: var(--surface); z-index: 1; }
    .sheet-grip::before { content: ''; position: absolute; left: 50%; top: 6px; width: 36px; height: 4px; margin-left: -18px; border-radius: 2px; background: var(--line); }
    .close { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--chip); font-size: 18px; cursor: pointer; margin-left: auto; }
    .hero { display: block; width: calc(100% - 40px); max-height: 46dvh; object-fit: contain; margin: 0 20px; border-radius: 12px; background: var(--chip); }
    .detail { padding: 16px 20px 0; }
    .detail h2 { font-family: var(--serif); font-size: 22px; line-height: 1.35; margin-bottom: 10px; }
    .rows { display: grid; grid-template-columns: 64px 1fr; gap: 8px 10px; font-size: 14px; line-height: 1.5; }
    .rows dt { color: var(--ink-3); }
    .rows dd { color: var(--ink); word-break: keep-all; overflow-wrap: anywhere; }
    .desc { margin-top: 14px; font-size: 14px; line-height: 1.7; color: var(--ink-2); white-space: pre-line; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 18px; }
    .btn { display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 12px; font-weight: 700; font-size: 15px; text-decoration: none; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
    .btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
    .btn[aria-disabled="true"] { opacity: .4; pointer-events: none; }
    .source { margin-top: 18px; font-size: 11px; color: var(--ink-3); }

    /* 지도 위 길찾기 패널 */
    .panel { position: absolute; inset: 0; z-index: 1050; background: var(--surface); display: none; flex-direction: column; }
    .panel.on { display: flex; }
    .panel-head { display: flex; align-items: center; gap: 8px; padding: 10px 10px 10px 14px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
    .panel-title { flex: 1; min-width: 0; font-family: var(--serif); font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .panel-btn { flex-shrink: 0; height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
    .panel-x { width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--chip); cursor: pointer; flex-shrink: 0; font-size: 15px; }
    #routePanel { inset: 10px 10px auto 10px; border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
    .panel-body { padding: 12px 14px; font-size: 14px; color: var(--ink-2); line-height: 1.6; }
    .route-sum { font-size: 15px; color: var(--ink); }
    .route-sum b { font-size: 20px; }
    .panel-foot { margin-top: 6px; font-size: 12px; color: var(--ink-3); }
    .panel-foot a { color: var(--ink-2); }

    /* 넓은 화면: 목록 + 지도 나란히 */
    @media (min-width: 900px) {
      body { max-width: none; }
      header, .controls { padding-left: 24px; padding-right: 24px; }
      #list { flex: 0 0 440px; display: block !important; padding-bottom: 24px; border-right: 1px solid var(--line); }
      #mapWrap { display: block !important; }
      #routePanel { left: 10px; right: auto; width: 360px; }
      .viewtoggle { display: none; }
      .sheet { left: auto; right: 24px; bottom: 24px; top: 24px; width: 440px; max-height: none; border-radius: 20px; transform: translateX(120%); }
      body.sheet-open .sheet { transform: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>서울 전시 <span>지도</span></h1>
      <div class="updated" id="updated"></div>
    </div>
    <p class="summary" id="summary">전시 정보를 불러오는 중…</p>
  </header>

  <section class="controls">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="전시명, 작가, 미술관 검색" autocomplete="off">
    </label>
    <div class="seg" id="status">
      <button data-v="now" class="on">진행 중</button>
      <button data-v="soon">곧 시작</button>
      <button data-v="all">전체</button>
    </div>
    <div class="chips">
      <button class="chip" id="near">📍 내 주변</button>
      <button class="chip" id="free">무료만</button>
      <button class="chip" id="sema">시립미술관</button>
      <select class="chip" id="gu"><option value="">모든 자치구</option></select>
      <select class="chip" id="sort">
        <option value="end">마감 임박순</option>
        <option value="start">최근 시작순</option>
        <option value="dist">가까운순</option>
      </select>
    </div>
  </section>

  <main>
    <div id="list" aria-live="polite"></div>
    <div id="mapWrap">
      <div id="map"></div>
      <section class="panel" id="routePanel" aria-label="길찾기"></section>
    </div>
  </main>

  <nav class="viewtoggle">
    <button data-v="list" class="on">목록</button>
    <button data-v="map">지도</button>
  </nav>

  <div class="sheet-bg" id="sheetBg"></div>
  <article class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="전시 상세"></article>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script>
  const $ = s => document.querySelector(s);
  const S = { all: [], view: [], status: 'now', free: false, sema: false, gu: '', sort: 'end', q: '', me: null, shown: 30, map: null, layer: null, markers: new Map(), selected: null };

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '';
  const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const TODAY = ymd(new Date());
  const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 864e5);
  const fmtDate = s => s ? s.slice(2).replace(/-/g, '.') : '';
  const period = e => e.start === e.end ? fmtDate(e.start) : `${fmtDate(e.start)} – ${fmtDate(e.end)}`;

  function distKm(a, b) {
    const R = 6371, r = Math.PI / 180;
    const dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  // 시립미술관 API에서 온 전시, 또는 문화행사 정보 중 시립미술관 분관 전시
  const isSema = e => e.source === 'sema' || e.source === 'both' || /서울시립|시립미술관/.test(`${e.title} ${e.place} ${e.org}`);
  const fmtDist = km => km < 1 ? `${Math.round(km * 1000)}m` : `${km.toFixed(1)}km`;

  function badges(e) {
    const out = [];
    if (e.free) out.push('<span class="badge free">무료</span>');
    if (isSema(e)) out.push('<span class="badge">시립미술관</span>');
    if (e.start > TODAY) {
      out.push(`<span class="badge">D-${daysBetween(TODAY, e.start)} 개막</span>`);
    } else {
      const left = daysBetween(TODAY, e.end);
      if (left === 0) out.push('<span class="badge hot">오늘 마감</span>');
      else if (left <= 7) out.push(`<span class="badge hot">${left}일 남음</span>`);
    }
    if (e._dist != null) out.push(`<span class="badge">${fmtDist(e._dist)}</span>`);
    return out.join('');
  }

  function poster(e, cls) {
    const src = safeUrl(e.image);
    return src
      ? `<img class="${cls}" src="${esc(src)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML='<div class=&quot;${cls} ph&quot;>畵</div>'">`
      : `<div class="${cls} ph">畵</div>`;
  }

  // 필터 · 정렬
  function apply() {
    const q = S.q.trim().toLowerCase();
    let v = S.all.filter(e => {
      if (S.status === 'now' && !(e.start <= TODAY && e.end >= TODAY)) return false;
      if (S.status === 'soon' && !(e.start > TODAY)) return false;
      if (S.free && !e.free) return false;
      if (S.sema && !isSema(e)) return false;
      if (S.gu && e.gu !== S.gu) return false;
      if (q && !`${e.title} ${e.place} ${e.artist} ${e.org}`.toLowerCase().includes(q)) return false;
      return true;
    });
    S.all.forEach(e => e._dist = S.me && e.lat ? distKm(S.me, e) : null);
    const by = {
      end: (a, b) => a.end.localeCompare(b.end) || a.title.localeCompare(b.title),
      start: (a, b) => b.start.localeCompare(a.start),
      dist: (a, b) => (a._dist ?? 1e9) - (b._dist ?? 1e9),
    }[S.sort];
    S.view = v.sort(by);
    S.shown = 30;
    renderList();
    renderMap();
    const label = { now: '지금 볼 수 있는 전시', soon: '곧 시작하는 전시', all: '진행 중·예정 전시' }[S.status];
    $('#summary').innerHTML = `${label} <b>${S.view.length.toLocaleString()}</b>곳${S.gu ? ` · ${esc(S.gu)}` : ''}`;
  }

  function renderList() {
    const list = $('#list');
    if (!S.all.length) return;
    if (!S.view.length) {
      list.innerHTML = '<div class="empty"><h2>조건에 맞는 전시가 없어요</h2>필터를 바꾸거나 검색어를 지워 보세요.</div>';
      return;
    }
    const items = S.view.slice(0, S.shown);
    list.innerHTML = items.map((e) => `
      <button class="card${S.selected === e ? ' sel' : ''}" data-i="${S.all.indexOf(e)}">
        ${poster(e, 'poster')}
        <div class="card-body">
          <h3>${esc(e.title)}</h3>
          <div class="meta">${esc(e.place)}${e.gu ? ` · ${esc(e.gu)}` : ''}</div>
          <div class="meta">${period(e)}</div>
          <div class="badges">${badges(e)}</div>
        </div>
      </button>`).join('') +
      (S.view.length > S.shown ? `<button class="more" id="more">더 보기 (${S.view.length - S.shown})</button>` : '');
  }

  $('#list').addEventListener('click', ev => {
    if (ev.target.closest('#more')) { S.shown += 30; renderList(); return; }
    const c = ev.target.closest('.card');
    if (c) openDetail(S.all[+c.dataset.i]);
  });

  // 지도
  function ensureMap() {
    if (S.map || !window.L) return;
    S.map = L.map('map', { zoomControl: false }).setView([37.5665, 126.978], 12);
    L.control.zoom({ position: 'topright' }).addTo(S.map);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    }).addTo(S.map);
    S.layer = L.layerGroup().addTo(S.map);
    S.map.on('popupopen', ev => {
      const b = ev.popup.getElement().querySelector('.pop-btn');
      if (b) b.onclick = () => openDetail(S.all[+b.dataset.i]);
    });
    renderMap();
  }

  function renderMap() {
    if (!S.map) return;
    S.layer.clearLayers();
    S.markers.clear();
    // 같은 장소의 전시는 한 마커로 묶는다
    const groups = new Map();
    for (const e of S.view) {
      if (e.lat == null) continue;
      const k = `${e.lat.toFixed(5)},${e.lng.toFixed(5)}`;
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(e);
    }
    const pts = [];
    for (const g of groups.values()) {
      const e0 = g[0];
      const icon = L.divIcon({ className: '', html: `<div class="pin${g.every(e => e.free) ? ' free' : ''}"></div>`, iconSize: [14, 14] });
      const html = g.slice(0, 5).map(e => `
        <div style="margin-bottom:6px">
          <div class="pop-title">${esc(e.title)}</div>
          <div class="pop-meta">${period(e)}${e.free ? ' · 무료' : ''}</div>
          <button class="pop-btn" data-i="${S.all.indexOf(e)}">자세히 보기 →</button>
        </div>`).join('') +
        `<div class="pop-meta">${esc(e0.place)}${g.length > 5 ? ` 외 ${g.length - 5}건` : ''}</div>`;
      const m = L.marker([e0.lat, e0.lng], { icon }).bindPopup(html, { maxWidth: 240 }).addTo(S.layer);
      g.forEach(e => S.markers.set(e, m));
      pts.push([e0.lat, e0.lng]);
    }
    if (S.me) {
      L.circleMarker([S.me.lat, S.me.lng], { radius: 7, color: '#fff', weight: 2, fillColor: '#2563EB', fillOpacity: 1 }).addTo(S.layer);
    }
    if (pts.length && !S.selected) S.map.fitBounds(pts, { padding: [30, 30], maxZoom: 15, animate: false });
  }

  // 상세
  function openDetail(e) {
    S.selected = e;
    const link = safeUrl(e.link);
    const rows = [
      ['기간', period(e)],
      ['장소', [e.place, e.gu].filter(Boolean).join(' · ')],
      ['요금', e.fee || (e.free ? '무료' : '')],
      ['관람', e.hours],
      ['대상', e.target],
      ['작가', e.artist],
      ['주최', e.org],
      ['거리', e._dist != null ? fmtDist(e._dist) : ''],
    ].filter(r => r[1]);
    $('#sheet').innerHTML = `
      <div class="sheet-grip"><button class="close" id="close" aria-label="닫기">✕</button></div>
      ${safeUrl(e.image) ? `<img class="hero" src="${esc(e.image)}" alt="${esc(e.title)} 포스터" referrerpolicy="no-referrer" onerror="this.remove()">` : ''}
      <div class="detail">
        <h2>${esc(e.title)}</h2>
        <div class="badges" style="margin-bottom:14px">${badges(e)}</div>
        <dl class="rows">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
        ${e.desc ? `<p class="desc">${esc(e.desc.slice(0, 600))}${e.desc.length > 600 ? '…' : ''}</p>` : ''}
        <div class="actions">
          <button class="btn primary" id="goRoute" aria-disabled="${e.lat == null}">길찾기</button>
          <a class="btn" href="${esc(link)}" target="_blank" rel="noopener" aria-disabled="${!link}">전시 홈페이지</a>
        </div>
        <p class="source">출처: 서울 열린데이터광장 · ${e.source === 'sema' ? '서울시립미술관 전시 정보' : e.source === 'both' ? '서울시 문화행사 정보, 서울시립미술관 전시 정보' : '서울시 문화행사 정보'}. 방문 전 운영 시간과 휴관일을 꼭 확인하세요.</p>
      </div>`;
    $('#close').onclick = closeDetail;
    $('#goRoute').onclick = () => showRoute(e);
    document.body.classList.add('sheet-open');
    $('#sheet').scrollTop = 0;
    document.querySelectorAll('.card.sel').forEach(c => c.classList.remove('sel'));
    document.querySelector(`.card[data-i="${S.all.indexOf(e)}"]`)?.classList.add('sel');
    if (S.map && e.lat != null && getComputedStyle($('#mapWrap')).display !== 'none') {
      S.map.setView([e.lat, e.lng], Math.max(S.map.getZoom(), 15));
    }
  }
  function closeDetail() {
    document.body.classList.remove('sheet-open');
    S.selected = null;
  }
  $('#sheetBg').onclick = closeDetail;
  addEventListener('keydown', ev => { if (ev.key === 'Escape') closeDetail(); });

  // 컨트롤
  $('#status').addEventListener('click', ev => {
    const b = ev.target.closest('button'); if (!b) return;
    S.status = b.dataset.v;
    $('#status').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    apply();
  });
  $('#free').onclick = () => { S.free = !S.free; $('#free').classList.toggle('on', S.free); apply(); };
  $('#sema').onclick = () => { S.sema = !S.sema; $('#sema').classList.toggle('on', S.sema); apply(); };
  $('#gu').onchange = ev => { S.gu = ev.target.value; $('#gu').classList.toggle('on', !!S.gu); apply(); };
  $('#sort').onchange = ev => {
    if (ev.target.value === 'dist' && !S.me) { locate(); return; }
    S.sort = ev.target.value; apply();
  };
  let qTimer;
  $('#q').oninput = ev => { clearTimeout(qTimer); qTimer = setTimeout(() => { S.q = ev.target.value; apply(); }, 150); };
  $('#near').onclick = locate;

  function getPosition() {
    return new Promise((ok, fail) => {
      if (!navigator.geolocation) return fail(new Error('이 브라우저는 위치 정보를 지원하지 않아요.'));
      navigator.geolocation.getCurrentPosition(
        p => { S.me = { lat: p.coords.latitude, lng: p.coords.longitude }; ok(S.me); },
        () => fail(new Error('위치 권한이 필요해요. 브라우저 설정에서 위치 접근을 허용해 주세요.')),
        { enableHighAccuracy: true, timeout: 10000 });
    });
  }

  async function locate() {
    $('#near').textContent = '📍 위치 확인 중…';
    try {
      await getPosition();
      S.sort = 'dist'; $('#sort').value = 'dist';
      $('#near').classList.add('on');
      apply();
      if (S.map) S.map.setView([S.me.lat, S.me.lng], 14);
    } catch (err) {
      $('#sort').value = S.sort;
      alert(err.message);
    }
    $('#near').textContent = '📍 내 주변';
  }

  // 길찾기: 내 위치와 전시장을 지도에 함께 띄우고 거리·예상 도보 시간을 보여준다
  async function showRoute(e) {
    if (e.lat == null) return;
    closeDetail();
    setView('map');
    ensureMap();
    if (!S.map) return;
    const kakao = `https://map.kakao.com/link/to/${encodeURIComponent(e.place || e.title)},${e.lat},${e.lng}`;
    const panel = body => {
      const p = $('#routePanel');
      p.innerHTML = `
        <div class="panel-head">
          <div class="panel-title">${esc(e.place || e.title)}까지</div>
          <button class="panel-btn" data-info>전시 정보</button>
          <button class="panel-x" data-close aria-label="닫기">✕</button>
        </div>
        <div class="panel-body">${body}
          <p class="panel-foot">대중교통 경로는 <a href="${esc(kakao)}" target="_blank" rel="noopener">카카오맵에서 보기</a></p>
        </div>`;
      p.classList.add('on');
      p.querySelector('[data-close]').onclick = closeRoute;
      p.querySelector('[data-info]').onclick = () => openDetail(e);
    };
    panel('<p>내 위치를 확인하는 중…</p>');
    let me;
    try { me = await getPosition(); } catch (err) { panel(`<p>${esc(err.message)}</p>`); return; }
    if (!S.routeLayer) S.routeLayer = L.layerGroup().addTo(S.map);
    S.routeLayer.clearLayers();
    const a = [me.lat, me.lng], b = [e.lat, e.lng];
    L.polyline([a, b], { color: '#6B7280', weight: 4, dashArray: '2 8', lineCap: 'round' }).addTo(S.routeLayer);
    L.circleMarker(a, { radius: 8, color: '#fff', weight: 3, fillColor: '#2563EB', fillOpacity: 1 }).bindTooltip('내 위치').addTo(S.routeLayer);
    L.marker(b, { icon: L.divIcon({ className: '', html: '<div class="pin" style="width:20px;height:20px;border-width:3px"></div>', iconSize: [20, 20] }) })
      .bindTooltip(e.place || e.title).addTo(S.routeLayer);
    const km = distKm(me, e);
    // 실제 길은 직선보다 길어서 1.3배로 보정하고, 시속 4.5km로 걷는다고 계산
    const min = Math.max(1, Math.round(km * 1.3 / 4.5 * 60));
    const walk = min < 60 ? `도보 약 ${min}분` : `도보 약 ${Math.floor(min / 60)}시간 ${min % 60}분`;
    panel(`<p class="route-sum"><b>${fmtDist(km)}</b> · ${walk}</p><p>점선은 직선 방향이에요.${km > 2 ? ' 거리가 멀어서 대중교통을 추천해요.' : ''}</p>`);
    S.map.invalidateSize(); // 목록 화면에서 막 넘어온 경우 지도 크기를 다시 잡는다
    const wide = matchMedia('(min-width: 900px)').matches;
    const top = $('#routePanel').offsetHeight;
    S.map.fitBounds([a, b], { paddingTopLeft: [wide ? 390 : 30, wide ? 40 : top + 30], paddingBottomRight: [30, wide ? 40 : 90], maxZoom: 16, animate: false });
  }
  function closeRoute() {
    $('#routePanel').classList.remove('on');
    $('#routePanel').innerHTML = '';
    S.routeLayer?.clearLayers();
  }

  function setView(v) {
    document.body.classList.toggle('view-map', v === 'map');
    document.querySelectorAll('.viewtoggle button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
    if (v === 'map') { ensureMap(); setTimeout(() => S.map && S.map.invalidateSize(), 50); }
  }
  document.querySelector('.viewtoggle').addEventListener('click', ev => {
    const b = ev.target.closest('button'); if (b) setView(b.dataset.v);
  });
  matchMedia('(min-width: 900px)').addEventListener('change', m => { if (m.matches) { ensureMap(); S.map?.invalidateSize(); } });

  // 데이터 로드
  async function load() {
    try {
      const res = await fetch('data/exhibitions.json', { cache: 'no-cache' });
      const data = await res.json();
      S.all = (data.items || []).filter(e => e.end >= TODAY);
      if (data.updatedAt) {
        const d = new Date(data.updatedAt);
        $('#updated').textContent = `${d.getMonth() + 1}/${d.getDate()} 갱신`;
      }
    } catch (err) {
      S.all = [];
    }
    if (!S.all.length) {
      $('#summary').textContent = '아직 전시 데이터가 없어요';
      $('#list').innerHTML = `<div class="empty"><h2>전시 데이터를 준비 중이에요</h2>
        서울 열린데이터광장 인증키를 GitHub 저장소 Secret <code>SEOUL_API_KEY</code>에 등록하면<br>
        매일 새벽 최신 전시 정보가 자동으로 채워집니다.</div>`;
      return;
    }
    const gus = [...new Set(S.all.map(e => e.gu).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'ko'));
    $('#gu').insertAdjacentHTML('beforeend', gus.map(g => `<option>${esc(g)}</option>`).join(''));
    apply();
    if (matchMedia('(min-width: 900px)').matches) ensureMap();
  }
  load();
  </script>
</body>
</html>
